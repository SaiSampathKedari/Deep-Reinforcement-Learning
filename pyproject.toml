[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-reinforcement-learning"
version = "0.1.0"
description = "From-scratch PyTorch implementations of deep reinforcement learning algorithms"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "torch",
    # The [torch] extra brings array_api_compat, which gymnasium.wrappers
    # NumpyToTorch imports lazily -- without it the wrapper raises a bare
    # ModuleNotFoundError.
    "gymnasium[torch]",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "tensordict>=0.14.1",
]

# numpy and scipy are deliberately absent: package computation uses Torch,
# including the bootstrap confidence intervals.
# numpy still arrives transitively via gymnasium and matplotlib.

[project.optional-dependencies]
# Examples persist scalar metrics in metrics.jsonl. TensorBoard is an optional
# viewer for those training metrics.
tb = ["tensorboard"]
# classic-control brings pygame-ce (rendering); other brings moviepy (mp4 writing).
video = ["gymnasium[classic-control,other]"]
box2d = ["gymnasium[box2d]"]    # LunarLander and BipedalWalker; needs system swig.
mujoco = ["gymnasium[mujoco]>=1.4.0"]  # Camera controls support MuJoCo 3.11+.

[dependency-groups]
dev = ["pytest", "ipykernel"]

# Without this, `pytest` from the repo root also tries to collect the reference
# repos cloned into external/ (cleanrl, spinningup, sb3, AgileRL).
[tool.pytest.ini_options]
testpaths = ["tests"]

# CUDA-enabled PyTorch on Linux and Windows; use PyPI on other platforms.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
