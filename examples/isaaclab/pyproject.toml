[project]
name = "deeprl-isaaclab-examples"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deep-reinforcement-learning[tb]",
    "isaaclab[video]==3.0.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
deep-reinforcement-learning = { path = "../..", editable = true }
isaaclab = { index = "nvidia" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
